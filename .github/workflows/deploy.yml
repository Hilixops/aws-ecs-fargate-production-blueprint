name: Deploy Airflow DAGs and Worker Container

on:
  push:
    branches:
      - main
    paths:
      - "dags/**"
      - "docker/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write # Required for requesting the JWT token via OIDC
  contents: read  # Required for actions/checkout

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
  DAGS_S3_BUCKET: ${{ secrets.DAGS_S3_BUCKET || vars.DAGS_S3_BUCKET }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'airflow-worker' }}

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Synchronize DAGs to Amazon S3
  # ----------------------------------------------------------------------------
  sync-dags:
    name: Sync DAGs to S3
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'dags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via IAM OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Synchronize DAGs to Private S3 Bucket
        run: |
          echo "==> Synchronizing DAG definitions to s3://${DAGS_S3_BUCKET}/..."
          aws s3 sync dags/ "s3://${DAGS_S3_BUCKET}/" --delete --exclude ".git*" --exclude "*.pyc"
          echo "==> S3 synchronization successful."

  # ----------------------------------------------------------------------------
  # Job 2: Build and Push Custom Airflow Worker Image to Amazon ECR
  # ----------------------------------------------------------------------------
  build-worker:
    name: Build & Push Worker Image
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'docker/') || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via IAM OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Worker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "==> Building Docker image for Airflow Worker..."
          docker build \
            --file docker/airflow-worker/Dockerfile \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            docker/airflow-worker

          echo "==> Pushing images to Amazon ECR..."
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          echo "==> Docker push completed successfully."
